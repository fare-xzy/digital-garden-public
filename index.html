<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>fare-xzy's Digital Garden</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="个人双链知识库 / 学习笔记 / 速查 / 排错 / 算法">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* fine-tunes on top of vue theme */
    :root { --theme-color: #2c8e6c; }
    .markdown-section code { background: #f6f6f6; padding: 0.1em 0.3em; border-radius: 3px; }
    .markdown-section pre code { background: transparent; }
    .markdown-section img { max-width: 100%; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">Loading Digital Garden...</div>
  <script>
  window.$docsify = {
    el: '#app',
    name: "fare-xzy's Digital Garden",
    repo: 'https://github.com/fare-xzy/digital-garden',
    // homepage: 根 README.md → 必须小写 'readme.md'，因为 deploy 的
    // lowercase pass 把所有文件名小写了
    homepage: 'readme.md',
    auto2top: true,
    loadSidebar: true,
    loadNavbar: true,
    subMaxLevel: 3,
    autoHeader: true,
      search: {
        paths: 'auto',
        placeholder: '🔍 搜索',
        noData: '哎呀，没有找到呀！',
        depth: 3
      },
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
</body>
</html>
